name: reeler

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reeler}
      POSTGRES_USER: ${POSTGRES_USER:-reeler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reeler}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reeler}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local LLM server for AI_LLM_PROVIDER=ollama (the default). The model
  # itself is NOT pulled automatically on first boot (a 2-4GB+ download) —
  # run `make ollama-pull` once after `docker compose up -d`.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/app
      # Anonymous volume: keeps the image's baked-in .venv (built by `uv
      # sync` at image-build time) from being shadowed by the `.:/app` bind
      # mount above, which would otherwise overlay the host's (nonexistent)
      # .venv and break `python`/every installed package inside the container.
      - /app/.venv
      - media_files:/app/media
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    entrypoint: docker/entrypoint.worker.sh
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - .:/app
      - /app/.venv  # see the comment on the same line in `web` above
      - media_files:/app/media
      - whisper_cache:/root/.cache/huggingface
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  media_files:
  ollama_data:
  whisper_cache:
