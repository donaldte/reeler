{% load static %}
<!doctype html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Reeler{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  <script src="{% static 'js/vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/vendor/alpine.min.js' %}" defer></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  <nav class="border-b border-slate-800">
    <div class="mx-auto max-w-5xl flex items-center justify-between px-4 py-3">
      <a href="{% url 'videos:upload' %}" class="font-semibold tracking-tight text-lg">
        🎬 Reeler
      </a>
      <div class="text-sm text-slate-400">
        {% if user.is_authenticated %}
          {{ user.username }} ·
          <form method="post" action="{% url 'logout' %}" class="inline">
            {% csrf_token %}
            <button type="submit" class="hover:text-slate-200">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="hover:text-slate-200">Log in</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-5xl px-4 py-8">
    {% for message in messages %}
      <div class="mb-4 rounded-md border border-amber-700 bg-amber-950 px-4 py-2 text-amber-200 text-sm">
        {{ message }}
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
